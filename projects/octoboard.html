<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Hugo's Homepage</title>
</head>
<body>
    <div class="split">
        <div class="left-split">
            <div class="buttons">
                <a href="../">
                    <button class="btn back-btn">
                        <svg class="btn-icon" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M664-240l56-56-384-384H680v-80H200v480h80v-344L664-240Z"></path></svg>
                        <span class="btn-text back-text">Back</span>
                    </button>
                </a>
            </div>
            <div class="img-block content-block">
                <div class="img-row">
                    <div class="img-card">
                        <div class="img-container">
                            <img src="../images/projects/octoboard.jpg" alt="Octoboard project board">
                        </div>
                    </div>
                    <div class="img-card">
                        <div class="img-container">
                            <img src="../images/projects/octoboard-2.jpg" alt="Octoboard project board">
                        </div>
                    </div>
                    <div class="img-card">
                        <div class="img-container">
                            <img src="../images/projects/octoboard-3.jpg" alt="Octoboard project board">
                        </div>
                    </div>
                </div>
            </div>
            <div class="about-block content-block">
                <h2>Octoboard</h2>
                <p>
                    Octoboard is a custom 8-bit (octo) microcontroller board built around the ATMega328P-PU.
                    It is fully hand solderable with THT components, and is programmed over ICSP.
                </p>
            </div>
            <div class="footer-block content-block">
                <p>
                Made with ♥ by Hugo H
                <br>
                Accurate as of October 2026
                </p>
            </div>
        </div>
        <div class="right-split">
            <img src="../images/HaLongBay-Boat.jpg">
        </div>
    </div>
</body>
</html>
